# Render Blueprint: deploy this repository as a static site.
# In Render: New + -> Blueprint, then select the GitHub repository containing this file.
services:
  - type: web
    name: fortnite-og
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
